name: Build EcoGraph Lab for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 matplotlib numpy Pillow openpyxl python-docx pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --clean --noconfirm --windowed --onefile --name "EcoGraph Lab" --collect-all PySide6 --collect-all matplotlib --collect-all openpyxl --collect-all docx "src/EcoGraphLab.py"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: EcoGraph-Lab-Windows
          path: dist/EcoGraph Lab.exe
